name: Bezpecne Zrcadleni do jine vetve

on:
  workflow_dispatch: # Ruční spuštění v záložce Actions
  schedule:
    - cron: '*/5 * * * *' # Kontrola každých 5 minut

jobs:
  check-and-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Porovnání větví a bezpečné zrcadlení
        run: |
          # 1. Získání posledního commitu z originálního webu (main)
          ORIGINAL_SHA=$(git ls-remote https://github.com refs/heads/main | awk '{print $1}')
          
          # 2. Získání posledního commitu z vaší zrcadlené větve (mirror-main)
          YOUR_SHA=$(git ls-remote https://github.com{{ github.event.repository.name }}.git refs/heads/mirror-main | awk '{print $1}')
          
          echo "Originál (main): $ORIGINAL_SHA"
          echo "Vaše zrcadlo (mirror-main): $YOUR_SHA"

          # 3. Pokud se liší, stáhneme pouze main a nahrajeme ho k vám jako mirror-main
          if [ "$ORIGINAL_SHA" != "$YOUR_SHA" ] || [ -z "$YOUR_SHA" ]; then
            echo "Zjištěna změna! Aktualizuji větev mirror-main..."
            
            # Klonujeme pouze větev main z originálu
            git clone --branch main --single-branch https://github.com repo_folder
            cd repo_folder
            
            # Nahrajeme ji k vám do větve mirror-main (parametr --force přepíše pouze tuto jednu větev)
            git push https://x-access-token:${{ secrets.MIRROR_TOKEN }}@://github.com{{ github.event.repository.name }}.git main:mirror-main --force
            echo "Větev mirror-main byla úspěšně aktualizována."
          else
            echo "Žádné změny. Repozitáře jsou synchronizované."
          fi
